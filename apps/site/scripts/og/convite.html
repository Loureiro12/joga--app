<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0F0F13;color:#FAFAFA;overflow:hidden}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:16px;font:800 56px/1 'Barlow Condensed';text-transform:uppercase;letter-spacing:-.5px}
  .brand b{color:#FACC15;font-weight:800}
  h1{margin:0;font:800 124px/.9 'Barlow Condensed';text-transform:uppercase;letter-spacing:-2px}
  h1 span{color:#FACC15}
  .pill{display:inline-block;background:#FACC15;color:#0F0F13;border-radius:99px;padding:14px 24px;font:600 26px 'DM Sans'}
  .faces{position:absolute;right:72px;bottom:64px;display:flex}
  .f{width:96px;height:96px;border-radius:50%;border:6px solid #0F0F13;margin-left:-26px;display:flex;align-items:center;justify-content:center;font:800 44px 'Barlow Condensed'}
</style></head><body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 40 40" width="68" height="68"><rect width="40" height="40" rx="12" fill="#7C3AED"/><ellipse cx="20" cy="20" rx="14" ry="9" fill="#FAFAFA"/><circle cx="23" cy="20" r="5.5" fill="#0F0F13"/><circle cx="25" cy="18" r="1.8" fill="#FACC15"/></svg><span>Joga<b>ê</b></span></div>
  <h1>Você foi<br>convidado <span>pra jogar</span></h1>
  <div><span class="pill">Toque para entrar na sala</span></div>
</div>
<div class="faces"><div class="f" style="background:#7C3AED">A</div><div class="f" style="background:#FACC15;color:#0F0F13">C</div><div class="f" style="background:#22C55E;color:#0F0F13">L</div><div class="f" style="background:#A78BFA;color:#0F0F13">P</div><div class="f" style="background:#EF4444">J</div></div>
</body></html>
