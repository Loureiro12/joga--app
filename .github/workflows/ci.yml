name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · testes · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (todos os workspaces)
        run: npm run typecheck
      - name: Testes (engine + room-server)
        run: npm test
      - name: Smoke do contrato RoomService
        run: npm run smoke:room
      - name: expo-doctor
        run: npx expo-doctor@latest
        working-directory: apps/mobile

  migrations:
    name: Migrations aplicam do zero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Sobe só o Postgres local e aplica todas as migrations + seed num banco vazio.
      - run: supabase db start
      - run: supabase db reset
      - name: Lint do schema
        run: supabase db lint --level warning --fail-on error
